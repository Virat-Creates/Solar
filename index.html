<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Bestie Day Priyansha ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff4e50,#fc913a,#ff6fd8,#3813c2);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:700px;
    padding:40px;
    text-align:center;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.15);
    border-radius:25px;
    border:1px solid rgba(255,255,255,0.3);
    box-shadow:0 0 40px rgba(255,255,255,0.2);
    color:white;
    animation:float 4s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

h1{
    font-size:3rem;
    text-shadow:0 0 20px #fff;
    margin-bottom:15px;
}

.bestie{
    color:#ffe600;
    text-shadow:0 0 25px #ffe600;
}

p{
    font-size:1.2rem;
    line-height:1.8;
    margin:20px 0;
}

.btn{
    padding:15px 35px;
    border:none;
    border-radius:50px;
    background:#fff;
    color:#ff1493;
    font-size:1rem;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.1);
}

#message{
    margin-top:25px;
    font-size:1.4rem;
    font-weight:bold;
    color:#fff;
}

.heart{
    position:absolute;
    color:white;
    font-size:25px;
    animation:rise linear infinite;
    opacity:.8;
}

@keyframes rise{
    from{
        transform:translateY(100vh);
        opacity:0;
    }
    to{
        transform:translateY(-100px);
        opacity:1;
    }
}
</style>
</head>
<body>

<div class="card">
    <h1>🌸 Happy Bestie Day 🌸</h1>

    <h2 class="bestie">Priyansha ❤️</h2>

    <p>
        Some friends become family, some become memories,
        but a few become priceless treasures.
        <br><br>
        Thank you for all the laughter, support,
        crazy moments and beautiful memories.
        <br><br>
        You are truly one of the most amazing people in my life.
    </p>

    <button class="btn" onclick="showMessage()">
        Click for a Surprise 🎁
    </button>

    <div id="message"></div>
</div>

<script>
function showMessage(){
    document.getElementById("message").innerHTML =
    "💖 Priyansha, you are not just my best friend, you are my forever favorite person. Happy Bestie Day! 💖";
}

for(let i=0;i<35;i++){
    let heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(4+Math.random()*6)+"s";
    heart.style.fontSize=(15+Math.random()*30)+"px";
    document.body.appendChild(heart);
}
</script>

</body>
</html>
