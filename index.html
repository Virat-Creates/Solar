<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earth and Moon Revolution</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#000;
        overflow:hidden;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .space{
        position:relative;
        width:800px;
        height:800px;
    }

    /* Sun */
    .sun{
        position:absolute;
        width:120px;
        height:120px;
        background:radial-gradient(circle, #ffff99, #ffcc00, #ff8800);
        border-radius:50%;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        box-shadow:0 0 50px #ffcc00,
                   0 0 100px #ff8800;
    }

    /* Earth's Orbit */
    .earth-orbit{
        position:absolute;
        width:500px;
        height:500px;
        border:1px solid rgba(255,255,255,0.2);
        border-radius:50%;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        animation:earthRevolve 20s linear infinite;
    }

    /* Earth */
    .earth{
        position:absolute;
        width:50px;
        height:50px;
        background:radial-gradient(circle at 30% 30%, #66ccff, #0066ff);
        border-radius:50%;
        top:50%;
        left:100%;
        transform:translate(-50%, -50%);
        box-shadow:0 0 15px #00aaff;
    }

    /* Moon Orbit */
    .moon-orbit{
        position:absolute;
        width:120px;
        height:120px;
        border:1px solid rgba(255,255,255,0.15);
        border-radius:50%;
        top:50%;
        left:50%;
        transform:translate(-50%, -50%);
        animation:moonRevolve 4s linear infinite;
    }

    /* Moon */
    .moon{
        position:absolute;
        width:16px;
        height:16px;
        background:#ddd;
        border-radius:50%;
        top:50%;
        left:100%;
        transform:translate(-50%, -50%);
        box-shadow:0 0 8px #fff;
    }

    @keyframes earthRevolve{
        from{
            transform:translate(-50%, -50%) rotate(0deg);
        }
        to{
            transform:translate(-50%, -50%) rotate(360deg);
        }
    }

    @keyframes moonRevolve{
        from{
            transform:translate(-50%, -50%) rotate(0deg);
        }
        to{
            transform:translate(-50%, -50%) rotate(360deg);
        }
    }

    .stars{
        position:absolute;
        width:100%;
        height:100%;
        background:
            radial-gradient(2px 2px at 20% 30%, white, transparent),
            radial-gradient(2px 2px at 70% 20%, white, transparent),
            radial-gradient(1px 1px at 40% 80%, white, transparent),
            radial-gradient(2px 2px at 85% 70%, white, transparent),
            radial-gradient(1px 1px at 10% 60%, white, transparent),
            radial-gradient(2px 2px at 60% 50%, white, transparent),
            radial-gradient(1px 1px at 90% 10%, white, transparent);
    }
</style>
</head>

<body>

<div class="stars"></div>

<div class="space">

    <div class="sun"></div>

    <div class="earth-orbit">
        <div class="earth">

            <div class="moon-orbit">
                <div class="moon"></div>
            </div>

        </div>
    </div>

</div>

</body>
  </html>
