<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet For You 💐</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fad0c4,#fbc2eb);
    font-family:'Segoe UI',sans-serif;
}

.container{
    position:relative;
    text-align:center;
}

.message{
    position:absolute;
    top:-120px;
    width:100%;
    color:white;
    text-shadow:0 0 10px rgba(0,0,0,.3);
    animation:fade 2s ease;
}

.message h1{
    font-size:42px;
}

.message p{
    font-size:20px;
    margin-top:10px;
}

.bouquet{
    position:relative;
    width:320px;
    height:450px;
}

.flower{
    position:absolute;
    animation:float 3s ease-in-out infinite;
}

.center{
    width:28px;
    height:28px;
    background:gold;
    border-radius:50%;
    position:absolute;
    left:36px;
    top:36px;
    z-index:2;
    box-shadow:0 0 20px gold;
}

.petal{
    width:38px;
    height:55px;
    background:radial-gradient(circle,#ffb6d9,#ff2d75);
    border-radius:50%;
    position:absolute;
}
